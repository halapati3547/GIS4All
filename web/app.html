<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Scout</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css?v=oc10">
<link rel="stylesheet" href="app-extra.css?v=oc10">
</head>
<body>
<div id="sample-banner" class="sample-banner" hidden>Showing SAMPLE data: sites below are made up. Run the pipeline to load real Orange County parcels.</div>
<header class="topbar">
  <a class="brand" href="/" title="About Site Scout" style="color:inherit;text-decoration:none"><span class="brand-mark" aria-hidden="true">◧</span> Site Scout</a>
  <label class="city">City <select id="city"><option>Santa Ana</option></select></label>
  <form id="lookup" class="lookup">
    <input id="address" type="search" placeholder="Search an address, e.g. 13092 Coast St, Garden Grove" aria-label="Check an address">
    <button type="submit" class="lookup-go" aria-label="Check address">🔍</button>
    <span id="lookup-msg" class="lookup-msg" aria-live="polite"></span>
  </form>
  <div class="topnote"><span id="checked" class="badge x-quiet-badge">Data checked …</span> · Not legal or financial advice · prototype · <button id="sources-btn" class="linkbtn" type="button">Sources ⓘ</button></div>
</header>
<p id="x-gaps" class="x-gaps" hidden></p>
<main class="layout">
  <aside class="left">
    <section class="filters" aria-label="Filters">
      <div class="x-fgroup"><div class="x-ftitle">What's on the land today</div><div class="x-chips" id="g-use"></div></div>
      <details class="x-morefilters" id="more-filters">
        <summary>More filters <span id="more-count" class="x-cnt"></span></summary>
      <div class="x-fgroup"><div class="x-ftitle">Who might sell?</div><div class="x-chips" id="g-lead"></div></div>
      <div class="x-fgroup"><div class="x-ftitle">Homes it could hold</div><div class="x-chips" id="g-homes"></div></div>
      <div class="x-fgroup"><div class="x-ftitle">Lot size</div><div class="x-chips" id="g-size"></div></div>
      <div class="x-fgroup x-frow">
        <label class="x-fsel">How could we build here?
          <select id="f-pathway">
            <option value="">Any state law</option>
            <option value="SB9">Split a lot or add a duplex</option>
            <option value="SB684">Small subdivision, up to 10 homes</option>
            <option value="AB2011">Homes on a commercial site</option>
            <option value="SB4">Church or college land</option>
            <option value="SB79">Near major transit</option>
          </select>
        </label>
      </div>
      <label class="check"><input id="f-haz" type="checkbox"> Avoid flood, fire and liquefaction zones</label>
      <label class="check"><input id="f-addr" type="checkbox"> Only sites with a street address</label>
      <button id="weights-btn" class="linkbtn x-quiet" type="button">How sites are ranked ⓘ</button>
      </details>
    </section>
    <div class="x-listhead">
      <h2 id="list-title" class="list-title">Best sites to call first</h2>
      <label class="x-sort"><select id="f-sort" aria-label="Sort sites"><option value="score">Sort: best match</option><option value="homes">Most homes</option><option value="size_desc">Biggest lot</option><option value="size_asc">Smallest lot</option></select></label>
    </div>
    <div id="x-active" class="x-active" aria-live="polite"></div>
    <ol id="list" class="list" tabindex="0"></ol>
  </aside>
  <div id="map" class="map"></div>
  <aside id="card" class="card" hidden></aside>
</main>
<dialog id="sources" class="modal"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js?v=oc10"></script>
</body>
</html>
